name: Brickwork
description: Brickwork is an omnichannel retail platform, now operated by DevHub, that powers a rich digital presence
  for physical retail stores. It provides store pages and the first omnichannel-enabling store locator, plus local
  activation around store services, appointments, in-store events with RSVPs, store hours, promotions, and customer
  records to drive qualified online traffic into brick-and-mortar locations. The Brickwork API v3 exposes 107 operations
  spanning admin management (stores, store types, services, appointments, events, RSVPs, customers, company users,
  regular and special hours, store images, alerts, transactions) and public front-end store, service, and event
  data. Admin endpoints authenticate with a company api_key query parameter; responses are JSON, paginated by page
  number, and support an optional locale path prefix for localization. Founded in 2013 and backed by Cowboy Ventures.
