                    description: Store Postal Code
                  country_code:
                    type: string
                    description: Store Country Code
                  contextual_address:
                    type: string
                    description: Store Contextual Address
                  parking_suggestions:
                    type: string
                    description: Store Parking Suggestions
                  phone_number:
                    type: string
                    description: Store Phone Number
                  email:
                    type: string
                    description: Store Email
                  send_from_email:
                    type: string
                    description: ''
                  keywords:
                    type: string
                    description: SEO keywords for store page
                  instagram_handle:
                    type: string
                    description: Store Instagram Handle
                  notes:
                    type: string
