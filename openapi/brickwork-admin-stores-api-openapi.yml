                  timezone:
                    type: string
                    description: Store Timezone
                  latitude:
                    type: number
                    description: Store Latitude. Only accepted when override_geocode is set to True. When override_geocode is set to true this field is required
                  longitude:
                    type: number
                    description: Store Longitude. Only accepted when override_geocode is set to True. When override_geocode is set to true this field is required
                  override_geocode:
                    type: boolean
                    description: T/F. When True, geocoding is disabled and custom latitude and longitude are required. Defaults to false
                  fedex:
                    type: string
                    description: ''
                  allow_subscriptions:
                    type: boolean
                    description: ''
                  max_appointments:
                    type: integer
                    description: If store appointments are enabled, how many simultaneous customers can be accommodated in a timeslot
                  online_capacity:
                    type: integer
                    description: '"fixed", "dynamic", "unlimited"'
                  total_capacity:
                    type: integer
                    description: ''
                  capacity_type:
                    type: string
                    description: ''
                  online_capacity_pct:
                    type: integer
                    description: Defaults to 100.0%
                  editorial_url:
                    type: string
                    description: ''
                  type:
                    type: object
                    description: Store Type
                  type_id:
                    type: integer
                    description: ID of Store Type
                  service_ids:
                    type: array
                    description: Array of Sevice IDs at the store
                  services:
                    type: array
                    description: Array of Services at the store
                  store_services:
                    type: array
                    description: Array of Store Services
                  feature_ids:
                    type: array
                    description: Array of Feature IDs at the store
                  language_ids:
                    type: array
                    description: Array of language IDs at the store
                  group_ids:
                    type: array
                    description: Array of Group IDs ar the store
                  metatags:
                    type: string
                    description: Add metatags to the store page
                  hide_from_robots:
                    type: boolean
                    description: Choose to allow or disallow the store page
                  hide_from_api:
                    type: boolean
                    description: Choose to show/hide in the api response
                  published_at:
                    type: string
                    description: Set a time to publish the store
                  close_date:
                    type: string
                    description: Set a time to unpublish the store
                  created_at:
                    type: string
                    description: Store Created at
                  updated_at:
                    type: string
                    description: Store Updated at
                  nextgen_id:
                    type: string
                    description: Nextgen Store ID
                  organization_nextgen_id:
                    type: string
                    description: Nextgen Organization ID
                  meta:
                    type: object
                    description: ''
      security:
      - apiKeyAuth: []
