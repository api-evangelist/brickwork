      - name: query[code]
        in: query
        required: false
        schema:
          type: array
        description: Filter store appointments by code ['code1','code2','code3']
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  appointments:
                    type: array
                    items:
                      type: object
                    description: Array of Appointment Objects
      security:
      - apiKeyAuth: []
