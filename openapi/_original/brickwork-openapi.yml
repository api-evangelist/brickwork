          application/json:
            schema:
              type: object
              properties:
                code:
                  type: string
                  description: Code unique to company
                role:
                  type: string
                  description: '"corporate_admin", "store_owner" or "associate"'
                first_name:
                  type: string
                  description: ''
                last_name:
                  type: string
                  description: ''
                email:
                  type: string
                  description: User's Email
                store_id:
                  type: integer
                  description: Only needed if role is "store_owner" or "associate"
