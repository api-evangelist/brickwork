                    type: string
                    description: User's Email
                  phone:
                    type: string
                    description: User's phone number
                  avatar:
                    type: string
                    description: User's avatar (deprecated)
                  profile_image_url:
                    type: string
                    description: User's profile image url
                  position:
                    type: string
